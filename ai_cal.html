<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .calculator {
            background-color: #1e1e2f;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 340px;
        }

        .display {
            background-color: #2b2b40;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: right;
            word-break: break-all;
            word-wrap: break-word;
        }

        .previous-operand {
            color: #8f8fa8;
            font-size: 0.9rem;
            min-height: 1.2rem;
            margin-bottom: 5px;
        }

        .current-operand {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 16px 0;
            border: none;
            border-radius: 12px;
            background-color: #2b2b40;
            color: #ffffff;
            transition: background-color 0.15s, transform 0.1s;
        }

        button:hover {
            background-color: #383856;
        }

        button:active {
            transform: scale(0.95);
        }

        button.span-two {
            grid-column: span 2;
        }

        .btn-operator {
            background-color: #3b3b5c;
            color: #ff9f43;
            font-weight: 600;
        }

        .btn-operator:hover {
            background-color: #4c4c78;
        }

        .btn-equals {
            background-color: #ff9f43;
            color: #ffffff;
            font-weight: 600;
        }

        .btn-equals:hover {
            background-color: #ffb168;
        }

        .btn-clear, .btn-delete {
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="buttons-grid">
            <button class="btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-delete" onclick="deleteNumber()">DEL</button>
            <button class="btn-operator" onclick="appendOperator('%')">%</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('-')">-</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>
            
            <button onclick="appendNumber('0')" class="span-two">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="btn-equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        const previousOperandElement = document.getElementById('previous-operand');
        const currentOperandElement = document.getElementById('current-operand');
        
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let resetScreen = false;

        function updateDisplay() {
            currentOperandElement.innerText = formatNumber(currentOperand);
            if (operation != null) {
                previousOperandElement.innerText = `${formatNumber(previousOperand)} ${operationDisplay(operation)}`;
            } else {
                previousOperandElement.innerText = '';
            }
        }

        function formatNumber(number) {
            if (number === '') return '';
            const stringNumber = number.toString();
            const parts = stringNumber.split('.');
            const integerDigits = parseFloat(parts[0]);
            const decimalDigits = parts[1];
            
            let integerDisplay;
            if (isNaN(integerDigits)) {
                integerDisplay = '';
            } else {
                integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
            }
            
            if (decimalDigits != null) {
                return `${integerDisplay}.${decimalDigits}`;
            } else {
                return integerDisplay;
            }
        }

        function operationDisplay(op) {
            if (op === '*') return '×';
            if (op === '/') return '÷';
            return op;
        }

        function appendNumber(number) {
            if (currentOperand === '0' || resetScreen) {
                currentOperand = number;
                resetScreen = false;
            } else {
                if (number === '.' && currentOperand.includes('.')) return;
                currentOperand += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = prev / current;
                    break;
                case '%':
                    computation = prev % current;
                    break;
                default:
                    return;
            }

            // 부동소수점 오차 보정
            currentOperand = Math.round(computation * 10000000000) / 10000000000;
            operation = undefined;
            previousOperand = '';
            resetScreen = true;
            updateDisplay();
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteNumber() {
            if (resetScreen) return;
            if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.toString().slice(0, -1);
            }
            updateDisplay();
        }

        // 키보드 입력 지원 추가
        window.addEventListener('keydown', e => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendNumber(e.key);
            }
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === '%') {
                appendOperator(e.key);
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                compute();
            }
            if (e.key === 'Backspace') {
                deleteNumber();
            }
            if (e.key === 'Escape') {
                clearAll();
            }
        });
    </script>
</body>
</html>
